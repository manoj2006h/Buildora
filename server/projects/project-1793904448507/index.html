<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Baby</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-rose-100 min-h-screen flex items-center justify-center font-sans overflow-hidden m-0">

    <div class="text-center px-6 py-12 bg-white/80 backdrop-blur-md shadow-2xl rounded-3xl border border-pink-200 max-w-md w-full mx-4 transform transition hover:scale-105 duration-300">
        <div class="text-6xl mb-4 animate-bounce">💖</div>
        <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-rose-600 tracking-tight mb-2">
            Hello baby
        </h1>
        <p class="text-gray-500 text-sm mt-2">Have a wonderful and lovely day ahead!</p>
        
        <div class="mt-6">
            <button id="loveBtn" class="bg-gradient-to-r from-pink-500 to-rose-500 text-white font-medium px-6 py-2.5 rounded-full shadow-lg shadow-pink-500/30 hover:from-pink-600 hover:to-rose-600 transition transform active:scale-95 focus:outline-none">
                Send Love ✨
            </button>
        </div>
    </div>

    <script>
        const btn = document.getElementById('loveBtn');
        btn.addEventListener('click', () => {
            const emojis = ['💖', '✨', '🌸', '💫', '🧸', '💌'];
            for (let i = 0; i < 15; i++) {
                const span = document.createElement('span');
                span.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                span.className = 'absolute text-2xl pointer-events-none transition-all duration-1000 ease-out';
                
                // Random position around center
                const startX = window.innerWidth / 2;
                const startY = window.innerHeight / 2;
                span.style.left = startX + 'px';
                span.style.top = startY + 'px';
                
                document.body.appendChild(span);

                const angle = Math.random() * Math.PI * 2;
                const distance = 100 + Math.random() * 150;
                const destX = startX + Math.cos(angle) * distance;
                const destY = startY + Math.sin(angle) * distance;

                requestAnimationFrame(() => {
                    span.style.transform = `translate(${destX - startX}px, ${destY - startY}px) scale(${1 + Math.random()})`;
                    span.style.opacity = '0';
                });

                setTimeout(() => {
                    span.remove();
                }, 1000);
            }
        });
    </script>
</body>
</html>
